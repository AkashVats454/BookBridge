version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: bookbridge_postgres
    environment:
      POSTGRES_USER: bookbridge_user
      POSTGRES_PASSWORD: bookbridge_password
      POSTGRES_DB: bookbridge_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookbridge_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  fastapi:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bookbridge_backend
    environment:
      DATABASE_URL: postgresql://bookbridge_user:bookbridge_password@postgres:5432/bookbridge_db
      HOST: 0.0.0.0
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bookbridge_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - fastapi

volumes:
  postgres_data:
